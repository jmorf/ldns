<!doctype html>
<html lang="en">

<head>
	<meta charset="utf-8" />
	<link rel="icon" href="%sveltekit.assets%/favicon.ico" type="image/x-icon" />
	<link rel="shortcut icon" href="%sveltekit.assets%/favicon.ico" />
	<meta name="viewport" content="width=device-width, initial-scale=1" />
	<!-- Early-paint theme script: avoid flash-of-wrong-theme on first paint. -->
	<script>
		(function () {
			try {
				var v = localStorage.getItem('ldns_theme');
				var theme = v === 'light' || v === 'dark' || v === 'system' ? v : 'system';
				var resolved = theme === 'system'
					? (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light')
					: theme;
				document.documentElement.classList.add(resolved);
			} catch (_) {
				document.documentElement.classList.add('dark');
			}
		})();
	</script>
	%sveltekit.head%
</head>

<body data-sveltekit-preload-data="hover" class="antialiased">
	<div>%sveltekit.body%</div>
</body>

</html>
