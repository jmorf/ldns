name: Claude Code Review

on:
  pull_request:
    types: [opened, synchronize]

permissions:
  contents: read

jobs:
  claude-review:
    # Only review PRs from the owner/members/collaborators. On a public repo
    # this would otherwise run — and spend Claude credits — on every PR from
    # every stranger, including drive-by and spam PRs. Maintainers can still
    # invoke a review on any PR on demand by commenting "@claude" (see
    # claude.yml), which is the right trade: opt-in for outside contributions,
    # automatic for our own.
    if: |
      github.event.pull_request.author_association == 'OWNER' ||
      github.event.pull_request.author_association == 'MEMBER' ||
      github.event.pull_request.author_association == 'COLLABORATOR'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
      issues: read
      id-token: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5
        with:
          fetch-depth: 1

      - name: Run Claude Code Review
        id: claude-review
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: |
            REPO: ${{ github.repository }}
            PR NUMBER: ${{ github.event.pull_request.number }}

            Please review this pull request and provide feedback on:
            - Code quality and best practices
            - Potential bugs or issues
            - Performance considerations
            - Security concerns
            - Test coverage

            Pay particular attention to the conventions in CONTRIBUTING.md:
            network calls in packages/core must use fetchWithTimeout and accept
            an AbortSignal; remote-derived values used as links must go through
            safeHttpUrl; server endpoints that fetch a user-supplied host must
            apply the SSRF guard (see SECURITY.md).

            Use AGENTS.md in the relevant package for style and architecture
            context. Be constructive and helpful in your feedback.

            Use `gh pr comment` with your Bash tool to leave your review as a comment on the PR.

          claude_args: '--allowed-tools "Bash(gh issue view:*),Bash(gh search:*),Bash(gh issue list:*),Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Bash(gh pr list:*)"'
