name: Bug report
description: Something in the LDNS extension or on ldns.com isn't working right.
title: "[Bug] "
labels: [bug]
body:
  - type: dropdown
    id: surface
    attributes:
      label: Where did you hit this?
      options:
        - Browser extension
        - ldns.com website
        - Both / not sure
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you expect to happen, and what happened instead? Screenshots welcome.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Look up example.com
        2. Open the Email tab
        3. …
  - type: input
    id: domain
    attributes:
      label: Domain being looked up (if relevant)
      description: The specific domain often matters — many bugs only reproduce on certain DNS configurations.
      placeholder: example.com
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Extension version (shown in Settings) and browser. Not needed for website-only issues.
      placeholder: |
        - LDNS extension: v1.8.0
        - Browser: Chrome 139
